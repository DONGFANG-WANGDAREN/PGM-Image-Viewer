<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station RX File Transfer</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box;}
.box{background:#1e293b;padding:32px;border-radius:12px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.3);}
h1{font-size:20px;margin:0 0 16px;}
p{color:#94a3b8;font-size:14px;margin-bottom:12px;line-height:1.5;}
.url{background:#334155;padding:12px;border-radius:8px;word-break:break-all;margin-bottom:16px;}
.url strong{color:#f8fafc;font-size:15px;}
#qr{width:240px;height:240px;background:#fff;border-radius:8px;margin:0 auto 16px;}
#status{font-size:13px;color:#94a3b8;}
</style>
</head>
<body>
<div class="box">
<h1>Station RX File Transfer</h1>
<p>Open the URL below on another device, then use this app's scan flow to confirm access.</p>
<div class="url"><strong id="loginUrl">Loading...</strong></div>
<div id="qr"><img id="qrImage" src="" style="width:100%;height:100%;border-radius:8px;"></div>
<div id="status">Waiting for scan...</div>
</div>
<script>
async function init(){
  try{
    const r=await fetch('/api/web-login-session');
    const d=await r.json();
    const sessionId=d.sessionId;
    const token=d.token;
    const loginUrl=d.loginUrl;
    const qrData='rrx://login?session='+encodeURIComponent(sessionId)+'&token='+encodeURIComponent(token);
    const qrImageUrl='/api/qr.png?data='+encodeURIComponent(qrData);
    window.sessionStorage.setItem('rrx_file_transfer_session',sessionId);
    document.getElementById('loginUrl').textContent=loginUrl;
    document.getElementById('qrImage').src=qrImageUrl;
    reportClientInfo(sessionId,'File-Transfer');
    setInterval(function(){check(sessionId);},2000);
  }catch(e){
    document.getElementById('status').textContent='Failed to load: '+e;
  }
}
async function check(sessionId){
  try{
    const r=await fetch('/api/session-status?session='+encodeURIComponent(sessionId));
    const d=await r.json();
    if(d.authenticated){
      reportClientInfo(sessionId,'files');
      window.location.href='/files';
      return;
    }
    document.getElementById('status').textContent='Waiting for scan...';
  }catch(e){
    document.getElementById('status').textContent='Connection error';
  }
}
function detectBrowser(){
  const ua=(navigator.userAgent||'').toLowerCase();
  if(ua.includes('edg/')) return 'Microsoft Edge';
  if(ua.includes('chrome/') && !ua.includes('edg/')) return 'Google Chrome';
  if(ua.includes('firefox/')) return 'Mozilla Firefox';
  if(ua.includes('safari/') && !ua.includes('chrome/')) return 'Safari';
  if(ua.includes('opr/') || ua.includes('opera/')) return 'Opera';
  return 'Unknown Browser';
}
function reportClientInfo(sessionId,page){
  try{
    const params=new URLSearchParams();
    params.set('session',sessionId);
    params.set('browser',detectBrowser());
    params.set('platform',navigator.platform||'');
    params.set('language',navigator.language||'');
    params.set('timezone',(Intl.DateTimeFormat().resolvedOptions().timeZone)||'');
    params.set('screenWidth',String(window.screen&&window.screen.width?window.screen.width:0));
    params.set('screenHeight',String(window.screen&&window.screen.height?window.screen.height:0));
    params.set('userAgent',navigator.userAgent||'');
    params.set('page',page||'File-Transfer');
    fetch('/api/web-login-client-info?'+params.toString()).catch(()=>{});
  }catch(e){}
}
init();
</script>
</body>
</html>
