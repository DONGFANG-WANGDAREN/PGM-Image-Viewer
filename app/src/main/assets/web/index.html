<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station RX Chat</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  background: #f8fafc;
  color: #1e293b;
  display: flex;
  flex-direction: column;
}
#topBar {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}
#topBar h1 { margin: 0; font-size: 18px; font-weight: 700; }
#status { font-size: 13px; color: #64748b; }
nav a { color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 12px; }
nav a:hover { text-decoration: underline; }
#log {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
.message {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 10px;
  max-width: 80%;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.message-system { background: #f1f5f9; color: #475569; font-size: 13px; }
.message-self { margin-left: auto; background: #eff6ff; border-color: #bfdbfe; }
.message-header { font-size: 12px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
.message-body { font-size: 14px; line-height: 1.5; word-break: break-word; }
.message img { max-width: 260px; max-height: 260px; border-radius: 8px; display: block; margin-top: 6px; cursor: pointer; }
#inputArea {
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
  padding: 12px 16px;
}
#sendBox { display: flex; gap: 8px; }
#msg {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
}
#msg:focus { border-color: #2563eb; }
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: #f1f5f9; color: #334155; }
.btn-secondary:hover { background: #e2e8f0; }
#dropZone {
  border: 2px dashed #cbd5e1;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  color: #64748b;
  font-size: 13px;
  margin-top: 10px;
  transition: all 0.15s ease;
}
#dropZone.drag-over { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
#imageInput { display: none; }
#uploadStatus { font-size: 12px; color: #64748b; margin-top: 8px; min-height: 18px; }
#previewLightbox {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.9);
  display: none; align-items: center; justify-content: center;
  z-index: 1000;
}
#previewLightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
#previewLightbox .close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>
<div id="topBar">
  <div>
    <h1>Station RX Chat</h1>
    <div id="status">Loading config...</div>
  </div>
  <nav style="margin-left:auto;">
    <a href="/files">File Manager</a>
    <a href="/chat">Chat</a>
  </nav>
</div>
<div id="log"></div>
<div id="inputArea">
  <div id="sendBox">
    <input id="msg" type="text" placeholder="Type a message...">
    <button class="btn btn-secondary" onclick="selectImage()">Image</button>
    <button class="btn btn-primary" onclick="send()">Send</button>
  </div>
  <input type="file" id="imageInput" accept="image/*" onchange="onImageSelected()">
  <div id="dropZone">Drag & drop images here to send</div>
  <div id="uploadStatus"></div>
</div>
<div id="previewLightbox" onclick="closePreview()"><span class="close">&times;</span><img id="previewImg" src=""></div>
<script>
function getQueryParam(key){const params=new URLSearchParams(window.location.search);return params.get(key);}
function generateName(){return 'Browser-'+Math.floor(Math.random()*10000).toString().padStart(4,'0');}
const userName=(getQueryParam('name')||'').trim()||generateName();
const logEl=document.getElementById('log');
const statusEl=document.getElementById('status');
const uploadStatusEl=document.getElementById('uploadStatus');
const dropZone=document.getElementById('dropZone');
let ws=null;
function escape(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function append(payload){
  try{
    const data=JSON.parse(payload);
    const line=document.createElement('div');
    line.className='message'+(data.system?' message-system':(data.from===userName?' message-self':''));
    const header=document.createElement('div');
    header.className='message-header';
    header.textContent=data.system?'System':data.from;
    const body=document.createElement('div');
    body.className='message-body';
    if(data.type==='image'&&data.url){
      body.textContent=data.message||'Image';
      const img=document.createElement('img');
      img.src=data.url;
      img.alt='image';
      img.onclick=function(e){e.stopPropagation();openPreview(data.url);};
      body.appendChild(img);
    }else{
      body.textContent=data.message||'';
    }
    line.appendChild(header);
    line.appendChild(body);
    logEl.appendChild(line);
  }catch(e){
    const line=document.createElement('div');
    line.className='message';
    line.textContent=payload;
    logEl.appendChild(line);
  }
  logEl.scrollTop=logEl.scrollHeight;
}
function connect(wsAddress){
  const wsUrl=wsAddress+(wsAddress.includes('?')?'&':'?')+'name='+encodeURIComponent(userName);
  ws=new WebSocket(wsUrl);
  ws.onopen=function(){statusEl.textContent='Connected as '+userName+' to '+wsAddress;};
  ws.onmessage=function(e){append(e.data);};
  ws.onclose=function(){statusEl.textContent='Disconnected. Reconnecting...';setTimeout(function(){connect(wsAddress);},2000);};
  ws.onerror=function(e){statusEl.textContent='Connection error.';};
}
function send(){const input=document.getElementById('msg');const text=input.value.trim();if(text&&ws&&ws.readyState===1){ws.send(text);input.value='';}}
function selectImage(){document.getElementById('imageInput').click();}
async function onImageSelected(){const input=document.getElementById('imageInput');if(!input.files.length)return;await uploadImage(input.files[0]);input.value='';}
async function uploadImage(file){
  uploadStatusEl.textContent='Uploading '+file.name+'...';
  try{
    const form=new FormData();
    form.append('image',file,file.name);
    const r=await fetch('/api/chat/upload-image',{method:'POST',body:form});
    const d=await r.json();
    if(!d.success)throw new Error(d.error||'upload failed');
    uploadStatusEl.textContent='Sent '+file.name;
  }catch(e){
    uploadStatusEl.textContent='Failed to send image: '+e.message;
  }
}
function setupDragAndDrop(){
  let dragCounter=0;
  document.body.addEventListener('dragenter',function(e){e.preventDefault();dragCounter++;dropZone.classList.add('drag-over');});
  document.body.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='copy';});
  document.body.addEventListener('dragleave',function(e){e.preventDefault();dragCounter--;if(dragCounter<=0){dragCounter=0;dropZone.classList.remove('drag-over');}});
  document.body.addEventListener('drop',function(e){e.preventDefault();dragCounter=0;dropZone.classList.remove('drag-over');const files=e.dataTransfer.files;for(const file of files){if(file.type.startsWith('image/')){uploadImage(file);}else{uploadStatusEl.textContent='Only image files are supported.';}}});
  dropZone.addEventListener('click',function(){selectImage();});
}
function openPreview(url){const box=document.getElementById('previewLightbox');const img=document.getElementById('previewImg');img.src=url;box.style.display='flex';}
function closePreview(){document.getElementById('previewLightbox').style.display='none';}
document.getElementById('msg').addEventListener('keypress',function(e){if(e.key==='Enter')send();});
async function init(){
  try{
    const r=await fetch('/api/config');
    const d=await r.json();
    connect(d.wsAddress);
  }catch(e){
    statusEl.textContent='Failed to load config: '+e;
  }
  setupDragAndDrop();
}
init();
</script>
</body>
</html>
